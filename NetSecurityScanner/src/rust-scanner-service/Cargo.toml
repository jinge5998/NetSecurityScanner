[package]
name = "rust-scanner-service"
# 引擎独立版本号（Cargo 要求三段式 semver）；随桌面端 v1.0.3.2 发布
version = "1.0.20"
edition = "2021"
authors = ["徐州鸿高电子科技有限公司"]
description = "高性能网络安全扫描服务 - Rust实现（TCP 端口发现由 RustScan 2.4.1 引擎承担，随桌面端 v1.0.3.2 发布）"

[dependencies]
# 异步运行时
tokio = { version = "1.40", features = ["full"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 命名管道 IPC
tokio-stream = "0.1"
interprocess = { version = "2.2", features = ["tokio"] }

# 网络扫描
socket2 = "0.5"
dns-lookup = "2.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 命令行参数
clap = { version = "4.5", features = ["derive"] }

# 时间处理
chrono = "0.4"

# 并发控制
async-channel = "2.3"
futures = "0.3"

# RustScan 引擎（GitHub 源码 vendor 集成，作为专家模式底层 TCP 端口发现引擎）
# 仓库: https://github.com/bee-san/RustScan
rustscan = { path = "vendor/RustScan-2.4.1" }
async-std = "1.13"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winsock2", "ws2def", "iphlpapi"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
