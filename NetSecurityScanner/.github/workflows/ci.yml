name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore dependencies
        run: |
          dotnet restore src/NetSecurityScanner.Core/NetSecurityScanner.Core.csproj
          dotnet restore src/NetSecurityScanner.Desktop/NetSecurityScanner.Desktop.csproj
          dotnet restore src/NetSecurityScanner.Core.Tests/NetSecurityScanner.Core.Tests.csproj

      - name: Build Core
        run: dotnet build src/NetSecurityScanner.Core/NetSecurityScanner.Core.csproj -c Release --no-restore

      - name: Build Desktop
        run: dotnet build src/NetSecurityScanner.Desktop/NetSecurityScanner.Desktop.csproj -c Release --no-restore

      - name: Build Tests
        run: dotnet build src/NetSecurityScanner.Core.Tests/NetSecurityScanner.Core.Tests.csproj -c Release --no-restore

      - name: Run tests
        run:
          dotnet test src/NetSecurityScanner.Core.Tests/NetSecurityScanner.Core.Tests.csproj -c Release --no-restore `
          --logger "console;verbosity=normal" `
          --collect:"XPlat Code Coverage" `
          --results-directory TestResults

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: TestResults/
          retention-days: 30

  security-scan:
    runs-on: windows-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check for vulnerable packages
        run: |
          dotnet list src/NetSecurityScanner.Core/NetSecurityScanner.Core.csproj --vulnerable
          dotnet list src/NetSecurityScanner.Desktop/NetSecurityScanner.Desktop.csproj --vulnerable
          dotnet list src/NetSecurityScanner.Core.Tests/NetSecurityScanner.Core.Tests.csproj --vulnerable

  rust-engine:
    name: Rust 扫描引擎（格式 / Clippy / 测试 / 构建）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: NetSecurityScanner/src/rust-scanner-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: NetSecurityScanner/src/rust-scanner-service

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Verify version output
        run: |
          .\target\release\rust-scanner-service.exe --version
